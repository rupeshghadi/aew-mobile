name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & System AIDL
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zip \
            unzip \
            aidl

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Cython>=0.29.33,<3.0.0" buildozer

      - name: Pre-Install Android SDK & Link Legacy Tools
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          mkdir -p "$SDK_DIR/licenses"

          # 1. Download official Android command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          rm cmdline-tools.zip

          # 2. Fix Buildozer's expected legacy path via symlink
          ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"

          # 3. Pre-accept licenses
          echo -e "24333f8a63b1d79439037b4e12351dd218a95717\n8938612766660abaf82caec50e3004f2b0d08c16\n7339e72b4255507971a9a612cd46860b792e8c77" > "$SDK_DIR/licenses/android-sdk-license"
          echo -e "84831b9409646a2b8e447d6a8c9db09440cc9c2d" > "$SDK_DIR/licenses/android-sdk-preview-license"

          # 4. Install platform-tools and build-tools
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Build APK via Buildozer
        run: |
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AEW-ERP-Android-Debug
          path: bin/*.apk
